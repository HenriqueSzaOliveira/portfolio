name: API Pools CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'portfolio/APIRestSelectPoolsInstances/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'portfolio/APIRestSelectPoolsInstances/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test-and-coverage:
    name: Testes e cobertura mínima
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./portfolio/APIRestSelectPoolsInstances

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r infra/requirements.txt
          python -m pip install -r tests/requirements.txt

      - name: Rodar testes com cobertura mínima
        run: |
          python -m pytest tests \
            --cov=portfolio.APIRestSelectPoolsInstances.src \
            --cov-fail-under=95 \
            --cov-report=term-missing
