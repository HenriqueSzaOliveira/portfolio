name: API Pools CI

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'portfolio/APIRestSelectPoolsInstances/**'
  pull_request:
    branches:
      - main
    paths:
      - 'portfolio/APIRestSelectPoolsInstances/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-coverage:
    name: Testes e cobertura mínima
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./portfolio/APIRestSelectPoolsInstances

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r infra/requirements.txt
          python -m pip install -r tests/requirements.txt

      - name: Rodar testes com cobertura mínima
        run: |
          python -m pytest tests \
            --cov=portfolio.APIRestSelectPoolsInstances.src \
            --cov-fail-under=95 \
            --cov-report=term-missing

      - name: Criar PR para main quando CI passar
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list --head "${GITHUB_REF_NAME}" --base main --json number --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "Merge ${GITHUB_REF_NAME} into main" \
              --body "## Resumo
              - Testes executados com sucesso
              - Cobertura mínima atingida: 95%
              - Branch origem: ${GITHUB_REF_NAME}"
          else
            echo "Já existe PR para ${GITHUB_REF_NAME} -> main (número: ${PR_NUMBER})."
          fi
